services:
  # 1. MongoDB Database
  mongo:
    image: mongo:7.0-jammy
    container_name: swadhyayi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: swadhyayi
    volumes:
      - mongo-data:/data/db
    networks:
      - swadhyayi-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Sorted Set Leaderboards
  redis:
    image: redis:7.0-alpine
    container_name: swadhyayi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - swadhyayi-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Node.js Express API Backend
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: swadhyayi-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/swadhyayi
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: swadhyayi_production_access_secret_super_secure_key_2026
      JWT_REFRESH_SECRET: swadhyayi_production_refresh_secret_super_secure_key_2026
      CLIENT_URL: http://localhost
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - swadhyayi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. React Vite Client Web App
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: swadhyayi-client
    restart: unless-stopped
    networks:
      - swadhyayi-net

  # 5. Nginx Edge Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: swadhyayi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - client
    networks:
      - swadhyayi-net

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

networks:
  swadhyayi-net:
    driver: bridge
